[suffix]
  cj = //
  info = //
[condition]
condition =
  LLVM
  x86
  Linux
  Unix
[internal-var]
  core_cmp_opt = %%cmp_opt_chir2hlir
  importlib = std/core.o
  compiler = cjc --chir-wfc on
  frontendCompiler = cjc-frontend --chir-wfc on
  ast2chir = 
  clang = clang
  ictu = $CANGJIE_HOME/tools/bin/ictu
  clang_opt = -c
  clang_cmp_opt = --rtlib=compiler-rt -lstdc++ -ldl -fno-omit-frame-pointer
  frontend = -frontend
  typecheck = --typecheck --output-type=staticlib
  dump-parse = --dump-parse
  dump-symbols = --dump-symbols
  dump-ir = --dump-ir
  dump-ast = --dump-ast
  overflowOpt = --int-overflow wrapping
  enableO2 = -O2
  enableChir2RGetOrThrowE = --enable-chir2-redundant-getorthrow-elimination
  enableCompileDebug = -g
  noColor = --diagnostic-format=noColor
  llvmLibPath = $CANGJIE_HOME/third_party/llvm/lib
  llvmDissembler = LD_LIBRARY_PATH=$CANGJIE_HOME/third_party/llvm/lib:$LD_LIBRARY_PATH $CANGJIE_HOME/third_party/llvm/bin/llvm-dis
  llvmELFReader = readelf
  compile_hotpatch_opt = --output-type=hotreload --experimental
  test_suffix = so
  cjsh = $CANGJIE_HOME/tools/bin/cjsh
  stack_trace_format = --stack-trace-format

  # Conditional Compilation
  conditional_compilation_config_opt = --cfg

  interpreter = cjc-frontend --chir-wfc on --chir-interpreter --interp-print-result

  debugCHIROpt = --chir-opt-debug
  enableCHIRCC = -chir-cc
  disableSemaVic = --disable-sema-vic
  disableSemaConstCheck = 
  enableEscapeAnalysis = --chir-ea on
  chilDebugFileDIR = %%n\_CHIRDebug
  chilDebugFileExt = chirdebug
  chilFileExt = chil
  dumpCHILDebugCFG = --chir-opt-debug
  dumpCHILDebug = --dump-chil-debug
  renderCHIR = --render-chir all
  disableCHIROpt = --disable-chir-opt
  disableBackendOpt = --disable-backend-opt
  devirFile = devir.file
  nonDevirFile = nonDevir.file

  incrementalCompile = --incremental-compile --incremental-debug
  cachePath = ./.cached/

  enableSwitchOpt = --fchir-switch-opt
  enableConstPropagation = --fchir-constant-propagation
  disableConstPropagation = --fno-chir-constant-propagation
  enableFuncInlining = --fchir-function-inlining
  enableLetcFolding = --fchir-letc-folding
  enableRefFolding = --fchir-ref-folding
  enableDevirtualization = --fchir-devirtualization
  enableTCO = --fchir-tail-recursion-optimization
  enableExceptionTransformation = --fchir-exception-transformation
  enableRedundantRetRemoval = --fchir-redundant-return-removal
  enableRedundantAssignRemoval = --fchir-redundant-assign-removal
  enableLoopIvariantCodeMotion = --fchir-loop-invariant-code-motion
  disableReflection = --disable-reflection

  cmp_opt_chir2hlir = --error-count-limit=all
  jet_cmp_opt = -frontend=cangjie +genmegaobj -add_export:=main
  mod_opt = --module
  mod_name_opt = --module-name
  pkg_opt = --package
  verbose_opt = --verbose
  coverage_opt = --coverage
  trimpath_opt = --trimpath
  import_path_opt = --import-path
  save_temps_opt = --save-temps
  int_overflow_opt = --int-overflow
  error_count_limit_opt = --error-count-limit
  output_dir_opt = --output-dir
  output_opt = --output
  gcc_lib_path_opt = --gcc-lib-path
  compile_exe_opt =
  compile_lib_opt = --output-type=staticlib
  lib_extension = a
  compile_shared_lib_opt = --output-type=dylib
  experimental_opt = --experimental
  no_stacktrace_info = --no-stacktrace-info

  gcc = gcc
  gcc_c = -c

  # Optimization
  optimization_level_2 = -O2

  error_count_limit_max = --error-count-limit=10000
  error_count_limit_all = --error-count-limit=all

  output = %%n.%%suffix
  suffix = out
  dylib_suffix  = so
  realOut = real.out
  run_args =
  run_opt =
  enableCHIR =
  enableAD = --enable-ad
  enableDebugAD = --debug-ad
  enableCHIRAD = --enable-chir-ad
  chircc =
  chir2llvm = -g
  run =
  cffi-link = -L ./ -l %%n
  pyffi-link =
  sync-link =
  libdir = $CANGJIE_HOME/modules/linux_x86_64_llvm
  tool_path = $CANGJIE_HOME/tools/bin
  jet = jc
  chir2hlir =
  clang_shared_opt = -shared -fPIC
  backend_pic =
  ast_lib_opt = -l cangjie-std-ast
  clang_args = -no-pie
  middle = a
  stdc++_opt = 

  stdx-package = -L $CANGJIE_HOME/lib/linux_x86_64_llvm/
  libllvm = $CANGJIE_HOME/lib/linux_x86_64_llvm
  link-core = -lcangjie-std-core
  link-ffiC =
  link-sync =
  link-convert =
  link-log =
  link-io =
  link-os =
  link-collection =
  link-serialization =
  link-time =
  link-math =
  link-format =
  link-random =
  link-argopt =
  link-net =
  link-json =
  link-regex =
  link-ffic =
  link-unicode =
  link-zlib =
  link-os-posix =
  main = ./main

  abi_checker = ./CangjieForeignChecker
  abi_checker_src = ../../../Tools/ABIChecker/

  # macro cfg
  cmp_macro = %%llvm --error-count-limit=all --coverage --compile-macro
  macro_lib =
  macro_parallel = --parallel-macro-expansion
  run_macro = export LD_LIBRARY_PATH=$(pwd):$LD_LIBRARY_PATH &&
  llvm = --backend llvm
  backend = --backend
  ulimit-error = --error-count-limit=all
  macro_debug = --debug-macro

  #c ffi
  cffi_output = lib%%n.so
  cffi_runtime_link = -I$CANGJIE_HOME/include -L $CANGJIE_HOME/runtime/lib/linux_x86_64_llvm/ -lcangjie-runtime --rtlib=compiler-rt -lstdc++ -ldl -fno-omit-frame-pointer
  cffi_std_link = -lstdc++
  pwd_to_ld_path = LD_LIBRARY_PATH=$(pwd):$LD_LIBRARY_PATH

  cmp_opt = --error-count-limit=10000 --diagnostic-format=noColor
  front_cmp_opt = --error-count-limit=10000 --diagnostic-format=noColor
  diag_json = --diagnostic-format=json

  # cross-compile
  target = --target
  toolchain = --toolchain
  sysroot = --sysroot
  host_arch = x86_64
  host_os = linux
  host_env = gnu

  # platform-dependent commands
  diff = diff
  rmfile = rm -f
  rmdir = rm -rf
  redirectNull = /dev/null
  touch = touch
  move = mv
  mkdir = mkdir -p
  cpfile = cp
  cpdir = cp -rf
  cat = cat
  lnfile = ln -s
  lndir = ln -s
  ls = ls
  ldd = ldd
  pwd = $(pwd)
  python = python3
  cd = cd
  grep = grep
  chmod = chmod
[description]
  title = chartest_HLIR
[env]
  LD_LIBRARY_PATH=./:$LD_LIBRARY_PATH
