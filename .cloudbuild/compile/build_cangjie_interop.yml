version: '2.0'
env:
  resource:
    type: "docker"
    image: ${x86_cangjie_build_image}
    class: 32U64G
    mode: toolbox

steps:
  PRE_BUILD:
    - checkout:
        path: Cangjie-Interop
        depth: 1
    - codehub:
        url: https://szv-open.codehub.huawei.com/innersource/CangjieLang/Cangjie.git
        branch: ${branch_cangjie}
        path: cangjie
    - codehub:
        url: https://szv-open.codehub.huawei.com/OpenBaize/C/zlix.git
        revision: refs/tags/tag_Cangjie_1.2.0_B100
        path: cangjie/third_party/baize/zlib
    - codehub:
        url: https://szv-open.codehub.huawei.com/innersource/CangjieLang/Maple-runtime.git
        branch: ${branch_runtime}
        path: cangjie/third_party/runtime
    - codehub:
        url: https://szv-open.codehub.huawei.com/innersource/CangjieLang/Cangjie-tools.git
        branch: ${branch_tools}
        path: tools
    - codehub:
        url: https://szv-open.codehub.huawei.com/innersource/CangjieLang/Cangjie-Stdx.git
        branch: ${branch_stdx}
        path: cangjie/third_party/stdx
    - codehub:
        url: https://szv-open.codehub.huawei.com/OpenBaize/C/zlix.git
        revision: refs/tags/tag_Cangjie_1.2.0_B100
        path: cangjie/third_party/stdx/third_party/baize/zlib
    - codehub:
        url: https://szv-open.codehub.huawei.com/OpenSourceCenter/PhilipHazel/pcre2.git
        revision: refs/tags/pcre2-10.44-h1
        path: cangjie/third_party/pcre2-10.44-h1
    - codehub:
        url: https://szv-open.codehub.huawei.com/innersource/CangjieLang/llvm-project.git
        revision: ${branch_llvm}
        path: cangjie/third_party/llvm-project
    - codehub:
        url: https://szv-open.codehub.huawei.com/OpenSourceCenter/google/flatbuffers.git
        revision: refs/tags/v24.3.25-h0.csi.Cangjie.r3
        path: cangjie/third_party/flatbuffers
  BUILD:
    # - build_debug
    - build_execute:
        command: |
          # Environment setup
          export C_INCLUDE_PATH=/opt/buildtools/openssl-3.0.9/include:$C_INCLUDE_PATH;
          echo "start building: cangjie ......"
          cd ${WORKSPACE}/cangjie
          # NextBuild configuration
          export NB_FILE_SERVER_IP=7.183.41.227:7.183.53.114:7.215.15.154:7.215.207.56:7.215.230.251:7.215.231.42
          export CCACHE_NOINODECACHE=true
          export NB_FILE_SERVER_TYPE=nextfs
          export XCACHE_HOOK_LOG=/usr1/xcache/xcache_hook.log
          export XCACHE_TELE_LOG=/usr1/xcache/xcache_tele.log
          export CCACHE_BASEDIR=${WORKSPACE}

          # WARNING: modifying the following command may cause the software fail to run on some Linux distros.
          # Check the dependencies of built binaries to make sure no extra dynamic dependencies are introduced.
          # - /opt/buildtools/openssl-3.0.9/lib64 must be specified to link againest openssl1.1 libs
          # - /opt/buildtools/libffi-3.4.2/ffi/lib64 must be specified to link againest libffi.a
          NextBuild --cache python3 build.py build -t release --cjnative --no-tests --enable-assert --gcc-toolchain=/opt/buildtools/gcc-7.3.0/ --target-lib=/opt/buildtools/openssl-3.0.9/lib64 --target-lib=/opt/buildtools/libffi-3.4.2/ffi/lib64 --compile-backend
          python3 build.py install
          echo "buildVersion=${ENV_PIPELINE_EXECUTOR}_${ENV_PIPELINE_NAME}.${ENV_PIPELINE_STARTTIME}" > ${WORKSPACE}/buildInfo.properties
          # add by LSP
          cp -r ${WORKSPACE}/cangjie/include/cangjie ${WORKSPACE}/cangjie/output/include
          let JOBS=$(cat /proc/cpuinfo| grep "processor"| wc -l)*2/3
          
          source ${WORKSPACE}/cangjie/output/envsetup.sh
          
          cd ${WORKSPACE}/cangjie/third_party/stdx;
          ${nextBuild} python3 build.py build -t release ${COMPILE_TYPE} --cjnative --include=${WORKSPACE}/cangjie/include --gcc-toolchain=/opt/buildtools/gcc-7.3.0/ --target-lib=/opt/buildtools/openssl-3.0.9/lib64;
          python3 build.py install;
          export CANGJIE_STDX_PATH=${WORKSPACE}/cangjie/third_party/stdx/target/linux_x86_64_llvm/static/stdx
          
          cd ${WORKSPACE}/tools/cpm
          sh build.sh
          cp ${WORKSPACE}/tools/cpm/config/linux/cjpm-config.toml ${CANGJIE_HOME}/tools/config
          
          export PATH=${WORKSPACE}/tools/cpm/output:${WORKSPACE}/tools/cjcov/output/bin:${WORKSPACE}/tools/codecheck/output/bin:${WORKSPACE}/cangjie/output/bin:${HOME}/.cjpm/bin:$PATH
          export LD_LIBRARY_PATH=${WORKSPACE}/tools/cpm/lib/:${WORKSPACE}/cangjie/output/runtime/lib/linux_x86_64_llvm:${WORKSPACE}/cangjie/output/third_party/llvm/lib:${LD_LIBRARY_PATH}
          
          cd ${WORKSPACE}/Cangjie-Interop/ffi
          chmod +x build.sh
          bash build.sh
        check:
          buildcheck: false
  POST_BUILD:
    - sh:
        command: |
          cd ${WORKSPACE}/Cangjie-Interop/ffi/ffi_python/target/
          tar -zcf ${WORKSPACE}/cangjie_interop_python_ffi.tar.gz ./*

    - artget:
        artifact_type: cloudartifact
        action: push
        file_path: cangjie_interop_python_ffi.tar.gz